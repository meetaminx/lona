# Runs Lona's scheduled job: syncs payments in flight, expires old invoices, retries webhooks.
# Every 30 minutes keeps a private repo inside GitHub's free Actions minutes.
# For faster updates, also point a free external scheduler (e.g. cron-job.org) at the same URL every 5 minutes.
# Setup: repository Settings > Secrets and variables > Actions > New repository secret: CRON_SECRET
# (the same value as CRON_SECRET in Vercel). Optional variable LONA_URL (default https://www.uselona.xyz).
name: Scheduled tick

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the tick endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LONA_URL: ${{ vars.LONA_URL || 'https://www.uselona.xyz' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set in repository secrets"; exit 1; fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$LONA_URL/api/cron/tick"
